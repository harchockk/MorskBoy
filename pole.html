<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/pole.css">
</head>
<body>
    
<div class="whole_game_part">
        <div class="menu_board" >

            <div class="difficulty_box">
            <div class="d_title">Сложность</div>

            <label class="d_label">
                <input class="d_check" type="radio" name="difficulty" value="1" checked>
                Легко
            </label>
            <label class="d_label">
                <input class="d_check" type="radio" name="difficulty" value="2">
                Нормально
            </label>
            <label class="d_label">
                <input class="d_check" type="radio" name="difficulty" value="3">
                Сложно
            </label>
        </div>

        </div>

        <div class="pole_main">
            <div class="field">
                <div class="cells_name" id="cells_name"></div>
                
                <div class="cells_number" id="cells_number"></div>
                
                <div class="pole" id="pole"></div>
            </div>

            <div class="menu_btn">
                <button class="start"  id="start" >Играть</button>
                <button class="clear"  id="clear" >Очистить</button>
                <button class="random" id="random">Случайно</button>
            </div>
        </div>
    </div>

    <div class="rotate_zone"></div>

    <script src="./scripts/pole.js"></script>
</body>
</html>
